services:
  premiarr:
    image: flashdim/premiarr:latest
    container_name: premiarr
    restart: unless-stopped
    environment:
      - XMLTV_URL=${XMLTV_URL:-https://example.com/guide.xml}
      - CHANNELS=1,2,3
      - CHECK_INTERVAL=${CHECK_INTERVAL:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ICS_PATH=/data/premiere.ics
      - SEASON_ONE_ONLY=${SEASON_ONE_ONLY:false}
      - SSL_CERT=/certs/cert.pem
      - SSL_KEY=/certs/cert.key
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/data
      - /opt/permiarr/certs/cert.pem:/certs/cert.pem
      - /opt/permiarr/certs/cert.key:/certs/cert.key
    ports:
      - "8001:8000"
